<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>교사 시간표 비교</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700&display=swap">
<style>
/* ── 디자인 토큰 ── */
:root {
  --bg:#F0F4FF;
  --surface:#FFFFFF;
  --surface2:#F6F8FF;
  --surface3:#EEF2FF;
  --border:#E0E7FF;
  --border2:#C7D2FE;
  --text:#0F172A;
  --muted:#64748B;
  --light:#94A3B8;
  --acc:#4F46E5;
  --acc2:#7C3AED;
  --acc-lt:#EEF2FF;
  --b-hd:#EEF2FF; --b-hd-c:#3730A3;
  --a-hd:#F0FDF4; --a-hd-c:#14532D;
  --diff:#FFFBEB; --diff-bd:#F59E0B; --diff-c:#78350F;
  --final:#FFF176; --final-c:#5C3200;
  --sb:#0F0F23;
  --sb-t:#D1D5DB;
  --duty:#BAE6FD; --duty-bd:#38BDF8; --duty-c:#0C4A6E;
  --sb-act:#4F46E5;
  --sb-ho:#1E1B4B;
  --r:12px;
  --shadow:0 4px 24px rgba(79,70,229,.08);
  --shadow-sm:0 2px 8px rgba(15,23,42,.06);
  --font:'Noto Sans KR',system-ui,sans-serif;
}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0A0A1A;--surface:#12122A;--surface2:#0F0F22;--surface3:#1A1A38;
  --border:#1E1B4B;--border2:#312E81;
  --text:#E2E8F0;--muted:#94A3B8;--light:#475569;
  --acc:#818CF8;--acc2:#A78BFA;--acc-lt:#1E1B4B;
  --b-hd:#1E1B4B;--b-hd-c:#A5B4FC;
  --a-hd:#052E16;--a-hd-c:#86EFAC;
  --diff:#1C1400;--diff-bd:#D97706;--diff-c:#FCD34D;
  --final:#3A2800;--final-c:#FFE57F;
  --sb:#06060F;--sb-t:#CBD5E1;--sb-act:#818CF8;--sb-ho:#0F0F2A;
  --duty:#0C3A5A;--duty-bd:#0284C7;--duty-c:#7DD3FC;
}}
:root[data-theme="dark"]{
  --bg:#0A0A1A;--surface:#12122A;--surface2:#0F0F22;--surface3:#1A1A38;
  --border:#1E1B4B;--border2:#312E81;
  --text:#E2E8F0;--muted:#94A3B8;--light:#475569;
  --acc:#818CF8;--acc2:#A78BFA;--acc-lt:#1E1B4B;
  --b-hd:#1E1B4B;--b-hd-c:#A5B4FC;
  --a-hd:#052E16;--a-hd-c:#86EFAC;
  --diff:#1C1400;--diff-bd:#D97706;--diff-c:#FCD34D;
  --final:#3A2800;--final-c:#FFE57F;
  --sb:#06060F;--sb-t:#CBD5E1;--sb-act:#818CF8;--sb-ho:#0F0F2A;
  --duty:#0C3A5A;--duty-bd:#0284C7;--duty-c:#7DD3FC;
}

*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{
  height:100%;
  background:var(--bg);
}
body{
  font-family:var(--font);
  background:var(--bg);
  color:var(--text);
  display:flex;height:100%;overflow:hidden;font-size:14px;
  /* 큰 모니터에서 노트북처럼 제한 */
  max-width:1540px;
  margin:0 auto;
  box-shadow:0 0 0 1px var(--border), 0 4px 40px rgba(79,70,229,.06);
}

/* ── 사이드바 (글라스모피즘) ── */
.sb{
  width:172px;min-width:172px;
  background:var(--sb);
  display:flex;flex-direction:column;overflow:hidden;flex-shrink:0;
  border-right:1px solid rgba(255,255,255,.05);
  position:relative;
}
.sb::before{
  content:'';position:absolute;top:0;left:0;right:0;height:160px;
  background:linear-gradient(180deg,rgba(79,70,229,.15) 0%,transparent 100%);
  pointer-events:none;
}
.sb-hd{
  padding:18px 14px 12px;
  border-bottom:1px solid rgba(255,255,255,.06);
  position:relative;
}
.sb-logo{
  display:flex;align-items:center;gap:7px;margin-bottom:6px;
}
.sb-logo-dot{
  width:22px;height:22px;border-radius:7px;flex-shrink:0;
  background:linear-gradient(135deg,#4F46E5,#7C3AED);
  display:flex;align-items:center;justify-content:center;
  font-size:11px;
  box-shadow:0 2px 8px rgba(79,70,229,.5);
}
.sb-title{
  font-size:11px;font-weight:700;letter-spacing:.06em;
  text-transform:uppercase;color:#C7D2FE;
}
.sb-cnt{font-size:11px;color:var(--sb-t);margin-top:1px}
.sb-srch{padding:8px 10px 6px}
.sb-filter{padding:0 10px 8px;border-bottom:1px solid rgba(255,255,255,.05)}
.btn-sort{
  width:100%;font-family:var(--font);font-size:11px;font-weight:600;
  background:rgba(255,255,255,.05);
  border:1px solid rgba(255,255,255,.09);
  border-radius:8px;color:var(--sb-t);padding:6px 9px;cursor:pointer;
  display:flex;align-items:center;gap:5px;
  transition:all .2s ease;letter-spacing:.01em;
}
.btn-sort:hover{background:rgba(255,255,255,.09);color:#C7D2FE;border-color:rgba(255,255,255,.15)}
.btn-sort.on{
  background:linear-gradient(135deg,rgba(79,70,229,.5),rgba(124,58,237,.4));
  border-color:rgba(129,140,248,.4);color:#C7D2FE;
}
.sb-srch input{
  width:100%;
  background:rgba(255,255,255,.05);
  border:1px solid rgba(255,255,255,.09);
  border-radius:8px;color:#C7D2FE;font-size:12px;
  padding:6px 9px;outline:none;font-family:var(--font);
  transition:border-color .2s;
}
.sb-srch input::placeholder{color:rgba(148,163,184,.35)}
.sb-srch input:focus{border-color:rgba(129,140,248,.6);background:rgba(255,255,255,.07)}
.sb-list{overflow-y:auto;flex:1;padding:4px 0}
.sb-list::-webkit-scrollbar{width:3px}
.sb-list::-webkit-scrollbar-thumb{background:rgba(255,255,255,.08);border-radius:2px}
.ti{
  padding:8px 12px;font-size:13px;color:#E2E8F0;cursor:pointer;
  display:flex;align-items:center;gap:7px;font-weight:500;
  transition:all .15s ease;
  border-radius:0;margin:1px 6px;border-radius:8px;
}
.ti:hover{background:rgba(255,255,255,.07);color:#C7D2FE}
.ti.on{
  background:linear-gradient(135deg,rgba(79,70,229,.35),rgba(124,58,237,.25));
  color:#fff;font-weight:700;
  border:1px solid rgba(129,140,248,.25);
  box-shadow:0 2px 12px rgba(79,70,229,.2);
}
.ti .badges{margin-left:auto;display:flex;gap:3px;align-items:center}
.ti .chg{
  background:linear-gradient(135deg,#F59E0B,#EF4444);
  color:#fff;font-size:8px;font-weight:800;
  padding:1px 5px;border-radius:20px;letter-spacing:.02em;
}
.ti .fin{
  background:linear-gradient(135deg,#FDE047,#F59E0B);
  color:#422006;font-size:8px;font-weight:800;
  padding:1px 5px;border-radius:20px;
}
.ti.on .chg{background:rgba(255,255,255,.25);color:#fff}
.ti.on .fin{background:rgba(253,224,71,.3);color:#FEF9C3}

/* ── 메인 영역 ── */
.main{flex:1;display:flex;flex-direction:column;overflow:hidden;min-width:0}

/* ── 탑바 ── */
.topbar{
  background:var(--surface);
  border-bottom:1px solid var(--border);
  padding:12px 20px;
  display:flex;align-items:center;gap:12px;flex-shrink:0;
  position:relative;
  box-shadow:var(--shadow-sm);
}
.topbar::after{
  content:'';position:absolute;bottom:0;left:0;right:0;height:2px;
  background:linear-gradient(90deg,#4F46E5,#7C3AED,#06B6D4);
  opacity:.6;
}
.top-name{
  font-size:18px;font-weight:800;letter-spacing:-.02em;
  background:linear-gradient(135deg,var(--acc),var(--acc2));
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;
  background-clip:text;
}
.top-sub{font-size:11px;color:var(--muted);margin-top:2px;font-weight:500}
.top-badge{
  font-size:11px;padding:4px 12px;border-radius:20px;
  font-weight:700;white-space:nowrap;letter-spacing:.01em;
}
.b-ok{background:var(--surface2);color:var(--muted);border:1px solid var(--border)}
.b-chg{
  background:linear-gradient(135deg,#FFFBEB,#FEF3C7);
  color:#92400E;border:1px solid #FDE68A;
  box-shadow:0 1px 6px rgba(245,158,11,.15);
}

/* ── 인쇄 버튼 ── */
.print-btns{margin-left:auto;display:flex;gap:8px;align-items:center;flex-shrink:0}
.btn-p{
  font-family:var(--font);font-size:12px;font-weight:700;
  padding:7px 14px;border-radius:9px;border:none;cursor:pointer;
  display:flex;align-items:center;gap:5px;
  transition:all .2s ease;letter-spacing:.01em;
}
.btn-p-cur{
  background:linear-gradient(135deg,#4F46E5,#7C3AED);
  color:#fff;box-shadow:0 3px 12px rgba(79,70,229,.35);
}
.btn-p-cur:hover{transform:translateY(-1px);box-shadow:0 5px 18px rgba(79,70,229,.45)}
.btn-p-all{
  background:var(--surface2);color:var(--text);
  border:1px solid var(--border2);
}
.btn-p-all:hover{background:var(--surface3);border-color:var(--acc)}
.btn-p-chg{
  background:linear-gradient(135deg,#0EA5E9,#0284C7);
  color:#fff;box-shadow:0 3px 12px rgba(14,165,233,.35);
}
.btn-p-chg:hover{transform:translateY(-1px);box-shadow:0 5px 18px rgba(14,165,233,.45)}

/* ── 컨텐츠 ── */
.content{
  flex:1;overflow-y:auto;
  padding:20px 22px;
  display:flex;flex-direction:column;gap:14px;
  background:var(--bg);
}
.content::-webkit-scrollbar{width:5px}
.content::-webkit-scrollbar-thumb{background:var(--border2);border-radius:3px}

/* ── 카드 그리드 ── */
.grids{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.card{
  background:var(--surface);
  border:1px solid var(--border);
  border-radius:14px;overflow:hidden;
  box-shadow:var(--shadow);
  transition:box-shadow .2s;
}
.card:hover{box-shadow:0 6px 32px rgba(79,70,229,.12)}
.card-hd{
  padding:10px 16px;font-size:12px;font-weight:800;
  letter-spacing:.04em;display:flex;align-items:center;gap:8px;flex-wrap:wrap;
}
.hd-b{
  background:linear-gradient(135deg,#EEF2FF,#E0E7FF);
  color:#3730A3;border-bottom:2px solid #C7D2FE;
}
.hd-a{
  background:linear-gradient(135deg,#F0FDF4,#DCFCE7);
  color:#14532D;border-bottom:2px solid #BBF7D0;
}
/* 카드 헤더 날짜 뱃지 */
.date-range{
  font-size:11px;font-weight:800;
  color:#fff;
  margin-left:6px;
  background:linear-gradient(135deg,#059669,#0891B2);
  border:none;
  padding:2px 10px;border-radius:20px;
  letter-spacing:.01em;
  box-shadow:0 2px 8px rgba(5,150,105,.3);
}
/* 탑바 적용 기간 뱃지 */
.top-date{
  display:flex;align-items:center;gap:6px;
  background:linear-gradient(135deg,#4F46E5,#7C3AED);
  color:#fff;font-size:12px;font-weight:800;
  padding:6px 14px;border-radius:22px;letter-spacing:.01em;
  box-shadow:0 3px 14px rgba(79,70,229,.4);
  white-space:nowrap;flex-shrink:0;
}
.top-date-icon{font-size:14px;line-height:1}

/* ── 시간표 테이블 ── */
.tw{overflow-x:auto}
.tt{border-collapse:collapse;width:100%;font-size:12px}
.tt th,.tt td{border:1px solid var(--border2);text-align:center;vertical-align:middle;padding:0}
.tt thead th{
  background:var(--surface3);color:var(--muted);
  font-size:10px;font-weight:700;letter-spacing:.04em;padding:7px 6px;
  border-top:none;
}
.tt thead tr:first-child th:first-child{ border-left:none; }
.tt thead tr:first-child th:last-child{ border-right:none; }
.tt tr td:first-child{ border-left:none; }
.tt tr td:last-child{ border-right:none; }
.tt tr:last-child td{ border-bottom:none; }
.tt thead th.dy{
  background:linear-gradient(135deg,var(--acc-lt),#E0E7FF);
  color:var(--acc);font-size:12px;font-weight:800;min-width:110px;
}
.pd{
  background:var(--surface3);color:var(--muted);
  font-size:10px;font-weight:600;width:44px;
  padding:0 5px;white-space:nowrap;
  border-right:2px solid var(--border2)!important;
}
.slot{height:58px;min-width:110px;transition:background .15s}
tr:nth-child(odd) .slot{background:var(--surface)}
tr:nth-child(even) .slot{background:var(--surface2)}
.slot.diff{ background:#FFFBEB!important; }
.slot.diff .ci{ border-left:3px solid #F59E0B; }
.ci{padding:5px 8px;line-height:1.4}
.cs{font-weight:700;font-size:12px;color:var(--text);display:block}
.cr{
  font-size:11px;font-weight:700;color:var(--acc);
  display:block;margin-top:2px;
  font-variant-numeric:tabular-nums;letter-spacing:.02em;
}
.diff .cs{color:#92400E}
.diff .cr{color:#B45309}
.slot.final{ background:#FFFF00!important; }
.slot.final .ci{ border-left:3px solid #B45309; }
.final .cs{color:#0033FF!important;font-weight:800!important}
.final .cr{color:#0022CC!important}
.slot.duty{ background:var(--duty)!important; }
.slot.duty .ci{ border-left:3px solid var(--duty-bd); }
.duty .cs{color:var(--duty-c)!important;font-weight:700!important}
.duty .cr{color:var(--duty-c)!important}
.slot.plus{ background:#7CFC00!important; }
.slot.plus .ci{ border-left:3px solid #22A600; }
.plus .cs{color:#003800!important;font-weight:800!important}
.plus .cr{color:#1A4400!important}
.empty{color:var(--border2);font-size:18px;line-height:58px}
.na{background:var(--border)!important;opacity:.25}

/* ── 범례 ── */
.legend{
  display:flex;gap:14px;align-items:center;flex-wrap:wrap;
  font-size:11px;color:var(--muted);
  padding:10px 16px;
  background:var(--surface);
  border:1px solid var(--border);
  border-radius:10px;
  box-shadow:var(--shadow-sm);
  font-weight:500;
}
.ld{width:12px;height:12px;border-radius:4px;flex-shrink:0}
.ld-d{background:linear-gradient(135deg,#FFFBEB,#FEF3C7);border:1.5px solid #FDE68A}
.lsep{width:1px;height:13px;background:var(--border2)}
.state{display:flex;flex-direction:column;align-items:center;justify-content:center;height:240px;gap:12px;color:var(--muted)}
.spin{
  width:28px;height:28px;
  border:3px solid var(--border2);
  border-top-color:var(--acc);
  border-radius:50%;animation:spin .7s linear infinite;
}
@keyframes spin{to{transform:rotate(360deg)}}

/* ── 화면 안내사항 박스 ── */
.sc-notes{
  background:linear-gradient(135deg,var(--acc-lt),rgba(124,58,237,.06));
  border:1px solid var(--border2);
  border-left:3px solid var(--acc);
  border-radius:0 10px 10px 0;
  padding:10px 16px;
  box-shadow:var(--shadow-sm);
}
.sc-notes-title{
  font-size:10px;font-weight:800;
  background:linear-gradient(135deg,var(--acc),var(--acc2));
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;
  background-clip:text;
  text-transform:uppercase;letter-spacing:.08em;margin-bottom:6px;
}
.sc-note-item{
  font-size:12px;color:var(--text);line-height:1.7;
  padding-left:14px;position:relative;font-weight:500;
}
.sc-note-item::before{
  content:'▸';position:absolute;left:0;
  background:linear-gradient(135deg,var(--acc),var(--acc2));
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;
  background-clip:text;
  font-size:10px;top:2px;
}

/* ── 인쇄 영역 (화면에서는 숨김) ── */
#printArea{display:none}

/* ── 태블릿 ── */
@media(max-width:900px){
  .top-date{ font-size:11px; padding:5px 11px; }
  .top-name{ font-size:16px; }
  .btn-p{ padding:6px 10px; font-size:11px; }
}

/* ── 모바일 ── */
@media(max-width:680px){
  body{ flex-direction:column; font-size:13px; }
  .main{ order:1; overflow:hidden; min-height:0; flex:1; }

  /* ── 사이드바 → 하단 가로 탭바 ── */
  .sb{
    order:2;
    width:100%;min-width:0;
    height:52px;flex-direction:row;align-items:center;
    border-right:none;
    border-top:1px solid rgba(255,255,255,.08);
    flex-shrink:0;
  }
  .sb::before{ display:none; }
  .sb-hd,.sb-srch,.sb-filter{ display:none; }
  .sb-list{
    display:flex;flex-direction:row;
    padding:6px 10px;gap:5px;
    overflow-x:auto;overflow-y:hidden;
    align-items:center;width:100%;
    -webkit-overflow-scrolling:touch;
  }
  .sb-list::-webkit-scrollbar{ height:0; }
  .ti{
    padding:5px 13px;white-space:nowrap;
    border-radius:20px;margin:0;
    font-size:12px;font-weight:600;flex-shrink:0;
    border:1px solid rgba(255,255,255,.1);
  }
  .ti .badges{ display:none; }
  .ti.on{ border-color:transparent; }

  /* ── 탑바 ── */
  .topbar{
    padding:9px 14px;gap:6px;
    flex-wrap:nowrap;
  }
  .top-date{ display:none; }  /* 날짜는 카드 헤더에만 표시 */
  .top-name{ font-size:15px; }
  .top-sub{ display:none; }
  .print-btns{ margin-left:auto; }
  .btn-p-all{ display:none; }
  .btn-p-chg{ font-size:11px;padding:6px 10px; }
  .btn-p-cur{ font-size:11px;padding:6px 10px; }

  /* ── 컨텐츠 ── */
  .content{ padding:10px 10px;gap:8px; }
  .legend{ font-size:10px;gap:8px;padding:7px 10px; }
  .sc-notes{ padding:7px 10px; }
  .sc-note-item{ font-size:11px; }

  /* ── 변경 전 카드 숨김, 변경 후만 표시 ── */
  .grids{
    grid-template-columns:1fr;gap:0;
  }
  .grids .card:first-child{ display:none; } /* 변경 전 숨김 */

  /* ── 변경 후 테이블: 화면 꽉 차게 ── */
  .grids .card:last-child{ border-radius:12px; }
  .tw{ overflow-x:auto;-webkit-overflow-scrolling:touch; }
  .tt{ table-layout:fixed;width:100%; }
  .tt thead th.dy{ min-width:0!important;font-size:11px;padding:6px 2px; }
  .tt thead th{ font-size:9px;padding:5px 2px; }
  .pd{ width:30px;font-size:9px;padding:0 3px; }
  .slot{ height:52px;min-width:0!important; }
  .ci{ padding:3px 3px; }
  .cs{ font-size:10px; }
  .cr{ font-size:9px;margin-top:1px; }
  .empty{ font-size:14px;line-height:52px; }
}

/* ════════════════════════════════
   인쇄 스타일
   ════════════════════════════════ */
@media print{
  @page{ size:A4 landscape; margin:6mm 6mm; }

  html,body{ height:auto!important; overflow:visible!important; display:block!important; background:#fff!important; }
  .sb,.main{ display:none!important; }
  #printArea{ display:block!important; }

  /* ── 페이지 컨테이너 ── */
  .pp{
    break-after:page; page-break-after:always;
    width:100%; font-family:'Noto Sans KR',sans-serif;
    display:flex; flex-direction:column; justify-content:space-between;
    height:calc(210mm - 12mm);
    box-sizing:border-box;
    padding:0 14mm;
  }
  .pp:last-child{ break-after:auto; page-break-after:auto; }
  /* 헤더+그리드를 감싸는 블록 — 세로 가운데 배치 */
  .pp-main{
    flex:1; display:flex; flex-direction:column;
    justify-content:center; gap:7px; min-height:0;
  }

  /* ── 상단 컬러 바 ── */
  .pp-bar{
    height:6px; border-radius:3px;
    background:linear-gradient(90deg,#4F46E5 0%,#7C3AED 50%,#06B6D4 100%);
    margin-bottom:9px; flex-shrink:0;
    -webkit-print-color-adjust:exact; print-color-adjust:exact;
  }

  /* ── 헤더 ── */
  .pp-hd{
    display:flex; align-items:center; justify-content:space-between;
    padding-bottom:8px; margin-bottom:8px;
    border-bottom:2px solid #E0E7FF; flex-shrink:0;
  }
  .pp-hd-left{ display:flex; flex-direction:column; gap:2px; }
  .pp-name{ font-size:21px; font-weight:800; color:#0F172A; letter-spacing:-.03em; }
  .pp-school{ font-size:10.5px; color:#64748B; margin-top:2px; font-weight:500; }
  .pp-hd-right{ display:flex; flex-direction:column; align-items:flex-end; gap:5px; }
  .pp-period{
    font-size:12px; font-weight:600; color:#065F46;
    background:#ECFDF5; border:1px solid #A7F3D0;
    padding:3px 10px; border-radius:20px;
    -webkit-print-color-adjust:exact; print-color-adjust:exact;
  }
  .pp-badge{ font-size:11px; font-weight:800; padding:3px 11px; border-radius:20px; letter-spacing:.01em; }
  .pp-badge-chg{
    background:#FFFBEB; color:#92400E; border:1px solid #FDE68A;
    -webkit-print-color-adjust:exact; print-color-adjust:exact;
  }
  .pp-badge-ok{
    background:#F8FAFC; color:#64748B; border:1px solid #CBD5E1;
    -webkit-print-color-adjust:exact; print-color-adjust:exact;
  }

  /* ── 그리드 ── */
  .pp-grids{
    display:grid; grid-template-columns:1fr 1fr; gap:8px;
  }
  .pp-card{
    border:1.5px solid #C7D2FE; border-radius:10px; overflow:visible!important;
    box-shadow:0 1px 4px rgba(79,70,229,.08);
  }
  .pp-card-hd{
    padding:7px 13px; font-size:11.5px; font-weight:800;
    letter-spacing:.04em; display:flex; align-items:center; gap:6px;
    flex-shrink:0; border-radius:9px 9px 0 0;
    -webkit-print-color-adjust:exact; print-color-adjust:exact;
  }
  .pp-hd-b{ background:#EEF2FF!important; color:#3730A3!important; border-bottom:1px solid #C7D2FE!important; }
  .pp-hd-a{ background:#F0FDF4!important; color:#14532D!important; border-bottom:1px solid #BBF7D0!important; }
  .pp-date{
    font-size:9.5px; font-weight:700; color:#065F46;
    background:#D1FAE5; border:1px solid #A7F3D0;
    padding:1px 8px; border-radius:20px; margin-left:8px;
    -webkit-print-color-adjust:exact; print-color-adjust:exact;
  }
  .pp-card .tw{ overflow:visible!important; max-width:100%; }
  .pp-card .tt{ width:100%; border-collapse:collapse; font-size:11px; table-layout:fixed; max-width:100%; }
  .pp .tt thead th.dy{ min-width:0!important; }

  /* ── 테이블 셀 ── */
  .pp .tt th,.pp .tt td{ border:1px solid #E0E7FF; text-align:center; vertical-align:middle; }
  .pp .tt thead th{
    font-size:9.5px; font-weight:700; color:#64748B; padding:5px 3px;
    background:#F6F8FF!important;
    -webkit-print-color-adjust:exact; print-color-adjust:exact;
  }
  .pp .tt thead th.dy{
    background:#EEF2FF!important; color:#4F46E5!important;
    font-size:11px; font-weight:800;
    -webkit-print-color-adjust:exact; print-color-adjust:exact;
  }
  .pp .pd{
    font-size:9px; font-weight:800; color:#64748B; padding:0 4px;
    background:#F6F8FF!important; width:34px; white-space:nowrap;
    -webkit-print-color-adjust:exact; print-color-adjust:exact;
  }
  .pp .slot{ min-width:0!important; width:auto; height:47px; }
  .pp tr:nth-child(odd) .slot{ background:#fff!important; }
  .pp tr:nth-child(even) .slot{ background:#F8FAFF!important;
    -webkit-print-color-adjust:exact; print-color-adjust:exact; }
  .pp .ci{ padding:3px 5px; line-height:1.35; }
  .pp .cs{ font-size:10px; font-weight:700; color:#0F172A; display:block; word-break:keep-all; overflow-wrap:break-word; }
  .pp .cr{ font-size:9px; font-weight:700; color:#4F46E5; display:block; margin-top:1px; }
  .pp .empty{ color:#C7D2FE; font-size:12px; }
  .pp .pd{ font-size:9px; font-weight:800; color:#64748B; padding:0 3px; background:#F6F8FF!important; width:28px; white-space:nowrap; -webkit-print-color-adjust:exact; print-color-adjust:exact; }

  /* ── 하이라이트 ── */
  .pp .slot.diff{
    background:#FFFBEB!important;
    -webkit-print-color-adjust:exact; print-color-adjust:exact;
  }
  .pp .diff .cs{ color:#92400E!important; font-weight:800!important; }
  .pp .diff .cr{ color:#B45309!important; font-weight:800!important; }
  .pp .slot.final{
    background:#FFFF00!important;
    -webkit-print-color-adjust:exact; print-color-adjust:exact;
  }
  .pp .slot.final .ci{ border-left:3px solid #B45309; }
  .pp .final .cs{ color:#0033FF!important; font-weight:800!important; }
  .pp .final .cr{ color:#0022CC!important; }
  .pp .slot.plus{
    background:#7CFC00!important;
    -webkit-print-color-adjust:exact; print-color-adjust:exact;
  }
  .pp .slot.plus .ci{ border-left:3px solid #22A600; }
  .pp .plus .cs{ color:#003800!important; font-weight:800!important; }
  .pp .plus .cr{ color:#1A4400!important; }
  .pp .slot.duty{
    background:#BAE6FD!important;
    -webkit-print-color-adjust:exact; print-color-adjust:exact;
  }
  .pp .slot.duty .ci{ border-left:3px solid #38BDF8; }
  .pp .duty .cs{ color:#0C4A6E!important; font-weight:700!important; }
  .pp .duty .cr{ color:#0C4A6E!important; }
  .pp .na{
    background:#EEF1F6!important; opacity:.6;
    -webkit-print-color-adjust:exact; print-color-adjust:exact;
  }

  /* ── 안내사항 주석 ── */
  .pp-notes{
    margin-top:6px; padding:6px 10px 7px;
    border:1px solid #CBD5E1; border-left:3px solid #2C5EE8;
    border-radius:0 6px 6px 0;
    background:#F8FAFC!important;
    flex-shrink:0;
    -webkit-print-color-adjust:exact; print-color-adjust:exact;
  }
  .pp-notes-title{
    font-size:9px; font-weight:700; color:#2C5EE8;
    text-transform:uppercase; letter-spacing:.06em;
    margin-bottom:4px;
  }
  .pp-note-item{
    font-size:10px; color:#1B2740; line-height:1.7;
    padding-left:10px; position:relative;
  }
  .pp-note-item::before{
    content:'▸'; position:absolute; left:0; color:#2C5EE8; font-size:9px;
  }

  /* ── 하단 푸터 (범례) ── */
  .pp-footer{
    display:flex; align-items:center; justify-content:space-between;
    margin-top:7px; padding-top:6px; border-top:1.5px solid #E0E7FF;
    flex-shrink:0;
  }
  .pp-legend{ display:flex; gap:10px; align-items:center; font-size:9.5px; color:#64748B; font-weight:500; }
  .pp-ld{
    width:10px; height:10px; border-radius:3px; display:inline-block; vertical-align:middle;
    -webkit-print-color-adjust:exact; print-color-adjust:exact;
  }
  .pp-lsep{ display:inline-block; width:1px; height:10px; background:#C7D2FE; vertical-align:middle; }
  .pp-copy{ font-size:9.5px; color:#94A3B8; font-weight:500; }
}
</style>
</head>
<body>

<div class="sb">
  <div class="sb-hd">
    <div class="sb-logo">
      <div class="sb-logo-dot">📋</div>
      <div class="sb-title">교사 목록</div>
    </div>
    <div class="sb-cnt" id="sbCnt">불러오는 중…</div>
  </div>
  <div class="sb-srch"><input id="srch" type="text" placeholder="이름 검색…" oninput="renderList()"></div>
  <div class="sb-filter">
    <button class="btn-sort on" id="btnSort" onclick="toggleSort()">↑ 변경순 (해제)</button>
  </div>
  <div class="sb-list" id="sbList"></div>
</div>

<div class="main">
  <div class="topbar">
    <div>
      <div class="top-name" id="tpName">교사를 선택하세요</div>
      <div class="top-sub" id="topSub"></div>
    </div>
    <span class="top-badge b-ok" id="tpBadge" hidden></span>
    <span class="top-date">
      <span class="top-date-icon">📅</span>
      <span id="topDateLabel"></span>
    </span>
    <div class="print-btns">
      <button class="btn-p btn-p-all" onclick="printAll()" title="전체 교사 인쇄">🖨️ 전체 인쇄</button>
      <button class="btn-p btn-p-chg" onclick="printChanged()" title="변경된 교사만 인쇄">🖨️ 변경만</button>
      <button class="btn-p btn-p-cur" onclick="printCurrent()" title="현재 교사 인쇄">🖨️ 현재 교사</button>
    </div>
  </div>
  <div class="content" id="content">
    <div class="state"><div class="spin"></div><div>데이터를 불러오는 중…</div></div>
  </div>
</div>

<!-- 인쇄 전용 영역 -->
<div id="printArea"></div>

<script>
const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbyrXoKySwqCCMLfTNsExXw_6ugNOmS3Xj9HI1iLUy5LMbOQs5QqudzHTlZ79E2_WKkkwg/exec';

// ── 제목 (변경 시 여기만 수정) ──
const TITLE = '수능 대비 Final 특강반';

// ══════════════════════════════════════════════════════════════
//  인쇄 고정 안내사항 — 모든 교사 인쇄본에 공통으로 표시됩니다.
//  빈 문자열('')로 바꾸면 안내사항이 나오지 않습니다.
// ══════════════════════════════════════════════════════════════
const PRINT_NOTE_GLOBAL = '2개반을 감독하는 경우 (예) 6반+7반 : 6반 뒷문, 7반 앞문을 열고 복도 책상에서 2반 자습 감독해주시면 됩니다!';

// ── 교사별 개별 추가 안내 (필요할 때만 사용) ──
const PRINT_NOTES = {
  // '홍길동': '추가 안내사항',
};

const DAYS    = ['월','화','수','목','금'];
const PERIODS = [7, 6, 6, 7, 6];
const MAX_P   = 7;
const DATE_RANGE = '10월 21일(수) ~ 11월 13일(금)';

let DB = {teachers:[], before:{}, after:{}, changed:{}};
let cur = null;

// 탑바 초기화
document.getElementById('topDateLabel').textContent = DATE_RANGE;
document.getElementById('topSub').textContent = TITLE + ' — 시간표 변경 전/후 비교';

async function load(){
  try{
    const res  = await fetch(SCRIPT_URL);
    const json = await res.json();
    DB = json;
    document.getElementById('sbCnt').textContent = DB.teachers.length + '명';
    renderList();
    if(DB.teachers.length) select(DB.teachers[0]);
  } catch(e){
    document.getElementById('content').innerHTML =
      `<div class="state">
        <div style="font-size:32px">⚠️</div>
        <div style="text-align:center;line-height:1.8">
          데이터를 불러오지 못했습니다.<br>
          <b>SCRIPT_URL</b>을 Apps Script 배포 URL로 교체해주세요.
        </div>
      </div>`;
    document.getElementById('sbCnt').textContent = '오류';
    console.error(e);
  }
}

let sortByChange = true;

function toggleSort(){
  sortByChange = !sortByChange;
  const btn = document.getElementById('btnSort');
  btn.className = 'btn-sort' + (sortByChange ? ' on' : '');
  btn.textContent = sortByChange ? '↑ 변경순 (해제)' : '↑ 변경순 정렬';
  renderList();
}

function hasFinal(name){
  const after = DB.after[name];
  if(!after) return false;
  return Object.values(after).some(c => c && c.s && c.s.includes('FINAL수업'));
}

function renderList(){
  const q = document.getElementById('srch').value.trim();
  let list = DB.teachers.filter(t => t.includes(q));
  if(sortByChange){
    list = [...list].sort((a,b) => {
      const fa = hasFinal(a) ? 2 : (DB.changed&&DB.changed[a]) ? 1 : 0;
      const fb = hasFinal(b) ? 2 : (DB.changed&&DB.changed[b]) ? 1 : 0;
      return fb - fa;
    });
  }
  document.getElementById('sbList').innerHTML = list.map(t => {
    const hasChg  = DB.changed && DB.changed[t];
    const hasFin  = hasFinal(t);
    const badges  = (hasChg || hasFin)
      ? `<span class="badges">${hasChg?'<span class="chg">변경</span>':''}${hasFin?'<span class="fin">FINAL</span>':''}</span>`
      : '';
    return `<div class="ti${t===cur?' on':''}" onclick="select('${t}')">
      <span class="nm">${t}</span>
      ${badges}
    </div>`;
  }).join('');
}

function buildGrid(sched, diffKeys){
  let h = `<div class="tw"><table class="tt"><thead>
    <tr>
      <th style="background:var(--surface2);width:46px"></th>
      ${DAYS.map(d => `<th class="dy">${d}요일</th>`).join('')}
    </tr>
  </thead><tbody>`;

  for(let p = 1; p <= MAX_P; p++){
    h += `<tr><td class="pd">${p}교시</td>`;
    DAYS.forEach((day, di) => {
      if(p > PERIODS[di]){
        h += `<td class="slot na"></td>`;
        return;
      }
      const key    = day + p;
      const cell   = sched ? sched[key] : null;
      const isDiff  = diffKeys && diffKeys.includes(key);
      const isFinal = cell && cell.s && cell.s.includes('FINAL수업');
      const isPlus  = cell && cell.r && cell.r.includes('+');
      const isDuty  = cell && cell.s && cell.s.includes('자율학습');
      if(cell){
        const cls = ['slot', isDiff?'diff':'', isFinal?'final':'', isPlus?'plus':'', isDuty?'duty':''].filter(Boolean).join(' ');
        const crLines = (cell.r || '').split('\n').filter(Boolean);
        const crHtml = crLines.map(p=>`<span class="cr">${esc(p)}</span>`).join('');
        h += `<td class="${cls}"><div class="ci">
            <span class="cs">${esc(cell.s)}</span>
            ${crHtml}
          </div></td>`;
      } else {
        h += `<td class="slot${isDiff?' diff':''}"><span class="empty">·</span></td>`;
      }
    });
    h += '</tr>';
  }
  return h + '</tbody></table></div>';
}

function esc(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

function select(name){
  cur = name;
  renderList();
  const diffs   = (DB.changed && DB.changed[name]) || [];
  const hasDiff = diffs.length > 0;

  document.getElementById('tpName').textContent = name + ' 선생님';
  const badge = document.getElementById('tpBadge');
  badge.hidden = false;
  badge.className = 'top-badge ' + (hasDiff ? 'b-chg' : 'b-ok');
  badge.textContent = hasDiff ? `변경 ${diffs.length}개` : '변경 없음';

  // 화면 안내사항
  const rawExtra0 = PRINT_NOTES[name];
  const extraArr0 = rawExtra0 ? (Array.isArray(rawExtra0) ? rawExtra0 : [rawExtra0]) : [];
  const allNotes0 = [...(PRINT_NOTE_GLOBAL ? [PRINT_NOTE_GLOBAL] : []), ...extraArr0];
  const scNotesHtml = allNotes0.length
    ? `<div class="sc-notes">
        <div class="sc-notes-title">📌 안내사항</div>
        ${allNotes0.map(n => `<div class="sc-note-item">${esc(n)}</div>`).join('')}
      </div>`
    : '';

  document.getElementById('content').innerHTML = `
    <div class="legend">
      <span class="ld ld-d"></span><span>변경된 수업</span>
      <span class="lsep"></span>
      <span class="ld" style="background:#FFFF00;border:1.5px solid #CCA800"></span><span>FINAL수업</span>
      <span class="lsep"></span>
      <span class="ld" style="background:#7CFC00;border:1.5px solid #3DA800"></span><span>대체교사(+)</span>
      <span class="lsep"></span>
      <span class="ld" style="background:#BAE6FD;border:1.5px solid #38BDF8"></span><span>자율학습감독</span>
      <span class="lsep"></span>
      <span>· 빈 교시</span>
      <span class="lsep"></span>
      <span>회색 = 해당 요일에 없는 교시</span>
    </div>
    ${scNotesHtml}
    <div class="grids">
      <div class="card">
        <div class="card-hd hd-b">◀ 변경 전</div>
        ${buildGrid(DB.before[name], diffs)}
      </div>
      <div class="card">
        <div class="card-hd hd-a">
          ▶ 변경 후
          <span class="date-range">(${DATE_RANGE})</span>
        </div>
        ${buildGrid(DB.after[name], diffs)}
      </div>
    </div>`;
}

/* ── 인쇄: 교사 1명분 HTML 생성 ── */
function buildPrintPage(name){
  const diffs   = (DB.changed && DB.changed[name]) || [];
  const hasDiff = diffs.length > 0;
  const badgeCls = hasDiff ? 'pp-badge-chg' : 'pp-badge-ok';
  const badgeTxt = hasDiff ? `변경 ${diffs.length}개` : '변경 없음';

  // 인쇄 주석 — 고정 + 교사별 병합
  const rawExtra = PRINT_NOTES[name];
  const extraArr = rawExtra
    ? (Array.isArray(rawExtra) ? rawExtra : [rawExtra])
    : [];
  const allNotes = [
    ...(PRINT_NOTE_GLOBAL ? [PRINT_NOTE_GLOBAL] : []),
    ...extraArr,
  ];
  const notesHtml = allNotes.length
    ? `<div class="pp-notes">
        <div class="pp-notes-title">📌 안내사항</div>
        ${allNotes.map(n => `<div class="pp-note-item">${esc(n)}</div>`).join('')}
      </div>`
    : '';

  return `<div class="pp">
    <div class="pp-bar"></div>
    <div class="pp-main">
      <div class="pp-hd">
        <div class="pp-hd-left">
          <div class="pp-name">${esc(name)} 선생님</div>
          <div class="pp-school">영생고등학교 — ${esc(TITLE)} 시간표 변경 전/후 비교</div>
        </div>
        <div class="pp-hd-right">
          <span class="pp-badge ${badgeCls}">${badgeTxt}</span>
        </div>
      </div>
      <div class="pp-grids">
        <div class="pp-card">
          <div class="pp-card-hd pp-hd-b">◀ 변경 전</div>
          ${buildGrid(DB.before[name], diffs)}
        </div>
        <div class="pp-card">
          <div class="pp-card-hd pp-hd-a">▶ 변경 후 <span class="pp-date">${DATE_RANGE}</span></div>
          ${buildGrid(DB.after[name], diffs)}
        </div>
      </div>
      ${notesHtml}
    </div>
    <div class="pp-footer">
      <div class="pp-legend">
        <span class="pp-ld" style="background:#FFF4E5;border:1px solid #F59E0B"></span>변경된 수업
        <span class="pp-lsep"></span>
        <span class="pp-ld" style="background:#FFFF00;border:1px solid #CCA800"></span>FINAL수업
        <span class="pp-lsep"></span>
        <span class="pp-ld" style="background:#7CFC00;border:1px solid #3DA800"></span>대체교사(+)
        <span class="pp-lsep"></span>
        <span class="pp-ld" style="background:#BAE6FD;border:1px solid #38BDF8"></span>자율학습감독
        <span class="pp-lsep"></span>
        회색 = 해당 요일에 없는 교시
      </div>
      <div class="pp-copy">영생고등학교</div>
    </div>
  </div>`;
}

/* ── 인쇄 직전: 테이블 너비 + 색상 강제 적용 ── */
window.addEventListener('beforeprint', function(){
  // 레이아웃
  document.querySelectorAll('#printArea .pp-card').forEach(function(el){
    el.style.setProperty('overflow','visible','important');
  });
  document.querySelectorAll('#printArea .tw').forEach(function(el){
    el.style.setProperty('overflow','visible','important');
    el.style.setProperty('max-width','100%','important');
  });
  document.querySelectorAll('#printArea .tt').forEach(function(el){
    el.style.setProperty('table-layout','fixed','important');
    el.style.setProperty('width','100%','important');
    el.style.setProperty('max-width','100%','important');
  });
  document.querySelectorAll('#printArea .slot, #printArea thead th').forEach(function(el){
    el.style.setProperty('min-width','0','important');
    el.style.setProperty('width','auto','important');
  });
  // 변경된 수업 배경색 강제
  document.querySelectorAll('#printArea .slot.diff').forEach(function(el){
    el.style.setProperty('background','#FFF4E5','important');
    el.style.setProperty('border-color','#F59E0B','important');
    el.style.setProperty('-webkit-print-color-adjust','exact','important');
    el.style.setProperty('print-color-adjust','exact','important');
  });
  document.querySelectorAll('#printArea .diff .cs').forEach(function(el){
    el.style.setProperty('color','#92400E','important');
  });
  document.querySelectorAll('#printArea .diff .cr').forEach(function(el){
    el.style.setProperty('color','#D97706','important');
  });
  // FINAL수업 배경색 강제
  document.querySelectorAll('#printArea .slot.final').forEach(function(el){
    el.style.setProperty('background','#FFFF00','important');
    el.style.setProperty('border-color','#CCA800','important');
    el.style.setProperty('-webkit-print-color-adjust','exact','important');
    el.style.setProperty('print-color-adjust','exact','important');
  });
  document.querySelectorAll('#printArea .final .cs').forEach(function(el){
    el.style.setProperty('color','#0033FF','important');
    el.style.setProperty('font-weight','800','important');
  });
  document.querySelectorAll('#printArea .final .cr').forEach(function(el){
    el.style.setProperty('color','#0022CC','important');
  });
  // + 대체교사 배경색 강제
  document.querySelectorAll('#printArea .slot.plus').forEach(function(el){
    el.style.setProperty('background','#7CFC00','important');
    el.style.setProperty('border-color','#3DA800','important');
    el.style.setProperty('-webkit-print-color-adjust','exact','important');
    el.style.setProperty('print-color-adjust','exact','important');
  });
  document.querySelectorAll('#printArea .plus .cs').forEach(function(el){
    el.style.setProperty('color','#000000','important');
    el.style.setProperty('font-weight','800','important');
  });
  document.querySelectorAll('#printArea .plus .cr').forEach(function(el){
    el.style.setProperty('color','#1A1A1A','important');
  });
  // 자율학습감독 배경색 강제
  document.querySelectorAll('#printArea .slot.duty').forEach(function(el){
    el.style.setProperty('background','#BAE6FD','important');
    el.style.setProperty('border-color','#38BDF8','important');
    el.style.setProperty('-webkit-print-color-adjust','exact','important');
    el.style.setProperty('print-color-adjust','exact','important');
  });
  document.querySelectorAll('#printArea .duty .cs').forEach(function(el){
    el.style.setProperty('color','#0C4A6E','important');
    el.style.setProperty('font-weight','700','important');
  });
  document.querySelectorAll('#printArea .duty .cr').forEach(function(el){
    el.style.setProperty('color','#0C4A6E','important');
  });
});
window.addEventListener('afterprint', function(){
  var sel = '#printArea .pp-card, #printArea .tw, #printArea .tt, #printArea .slot, #printArea thead th, #printArea .diff .cs, #printArea .diff .cr, #printArea .final .cs, #printArea .final .cr, #printArea .plus .cs, #printArea .plus .cr, #printArea .duty .cs, #printArea .duty .cr';
  ['overflow','max-width','table-layout','width','min-width','background','border-color','-webkit-print-color-adjust','print-color-adjust','color','font-weight'].forEach(function(prop){
    document.querySelectorAll(sel).forEach(function(el){
      el.style.removeProperty(prop);
    });
  });
});

function printCurrent(){
  if(!cur){ alert('교사를 먼저 선택하세요.'); return; }
  document.getElementById('printArea').innerHTML = buildPrintPage(cur);
  window.print();
}

function printAll(){
  if(!DB.teachers.length){ alert('데이터가 아직 로드되지 않았습니다.'); return; }
  document.getElementById('printArea').innerHTML = DB.teachers.map(buildPrintPage).join('');
  window.print();
}

function printChanged(){
  if(!DB.teachers.length){ alert('데이터가 아직 로드되지 않았습니다.'); return; }
  const changed = DB.teachers.filter(name => {
    const keys = DB.changed[name];
    return keys && keys.length > 0;
  });
  if(!changed.length){ alert('변경된 교사가 없습니다.'); return; }
  document.getElementById('printArea').innerHTML = changed.map(buildPrintPage).join('');
  window.print();
}

load();
</script>
