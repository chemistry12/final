<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Final 특강 출석 안내</title>
<style id="dynPrintStyle"></style>
<style>
:root {
  --bg:#F8FAFC; --card:#FFF; --border:#E2E8F0;
  --text:#1E293B; --muted:#64748B; --light:#94A3B8;
  --accent:#4F46E5; --accent-light:#EEF2FF;
}
* { box-sizing:border-box; margin:0; padding:0; }
body { font-family:'Apple SD Gothic Neo',Malgun Gothic,sans-serif;
       background:var(--bg); color:var(--text); min-height:100vh; }

/* ── 공통 네비게이션 바 ── */
.site-nav{
  display:flex;align-items:center;gap:2px;
  background:#06060F;border-bottom:1px solid rgba(255,255,255,.1);
  padding:0 10px;height:36px;
}
.snav-tab{
  display:inline-flex;align-items:center;gap:5px;
  padding:4px 13px;border-radius:6px;
  font-size:12px;font-weight:700;color:#64748B;
  text-decoration:none;transition:all .12s;white-space:nowrap;
}
.snav-tab:hover{background:rgba(255,255,255,.06);color:#C7D2FE;}
.snav-tab.cur{background:#312E81;color:#A5B4FC;}

/* ── 상단바 ── */
.topbar {
  background:#1E1B4B; color:#A5B4FC;
  padding:10px 16px; display:flex; align-items:center; gap:10px; flex-wrap:wrap;
}
.topbar h1 { font-size:15px; font-weight:800; color:#fff; flex:1; min-width:180px; }
.topbar .sub { font-size:11px; color:#818CF8; }
.btn-link {
  display:inline-flex; align-items:center; gap:4px;
  padding:6px 12px; border-radius:7px;
  background:#312E81; color:#A5B4FC;
  font-size:12px; font-weight:700; text-decoration:none; border:none; cursor:pointer;
  border:1px solid #3730A3; transition:background .15s;
}
.btn-link:hover { background:#3730A3; }
.btn-print { background:#1E3A5F; color:#93C5FD; border-color:#1E40AF; }
.btn-print:hover { background:#1E40AF; }
.btn-printall { background:#064E3B; color:#6EE7B7; border-color:#047857; }
.btn-printall:hover { background:#047857; }
.print-controls {
  display:flex; align-items:center; gap:4px; flex-wrap:wrap;
}
.print-label {
  font-size:11px; color:#818CF8; white-space:nowrap; margin-right:2px;
}
.scale-btn {
  padding:4px 9px; border-radius:6px; border:1px solid #4338CA;
  background:#1E1B4B; color:#A5B4FC; font-size:11px; font-weight:700;
  cursor:pointer; transition:all .12s;
}
.scale-btn:hover { background:#312E81; }
.scale-btn.active { background:#4338CA; color:#fff; border-color:#6366F1; }
.divider { width:1px; height:20px; background:rgba(255,255,255,.15); margin:0 4px; }

/* ── 반 선택 탭 ── */
.class-tabs {
  background:#fff; border-bottom:2px solid var(--border);
  padding:8px 16px 0; display:flex; gap:4px; flex-wrap:wrap;
}
.cls-tab {
  padding:6px 14px; border-radius:8px 8px 0 0;
  font-size:13px; font-weight:700; cursor:pointer;
  border:1px solid transparent; border-bottom:none;
  color:var(--muted); background:transparent; transition:all .15s;
}
.cls-tab:hover { background:#F1F5F9; color:var(--text); }
.cls-tab.active {
  background:#fff; color:var(--accent);
  border-color:var(--border); border-bottom:2px solid #fff;
  margin-bottom:-2px;
}
.cls-tab.has-absent { color:#D97706; }
.cls-tab.active.has-absent { color:#B45309; }

/* ── 메인 ── */
.main { padding:16px; max-width:960px; margin:0 auto; }
.loading { text-align:center; padding:60px; color:var(--muted); font-size:14px; }
.error-msg { text-align:center; padding:40px; color:#DC2626; font-size:13px; }

/* 반 헤더 */
.class-header-bar {
  display:flex; align-items:center; gap:10px; margin-bottom:14px; flex-wrap:wrap;
}
.class-title { font-size:20px; font-weight:900; color:var(--text); }
.class-subtitle { font-size:12px; color:var(--muted); }
.total-badge {
  margin-left:auto; padding:4px 12px; border-radius:20px;
  font-size:12px; font-weight:700;
  background:#FEF3C7; color:#92400E; border:1px solid #FCD34D;
}
.total-badge.zero { background:#F1F5F9; color:#94A3B8; border-color:#E2E8F0; }

/* ── 영생관독실 배너 ── */
.gwandok-bar {
  display:flex; align-items:center; gap:10px; flex-wrap:wrap;
  padding:12px 16px; margin-bottom:14px;
  background:#EFF6FF; border:2px solid #93C5FD;
  border-left:5px solid #2563EB;
  border-radius:10px;
}
.gwandok-label {
  font-size:14px; font-weight:900; color:#1D4ED8;
  letter-spacing:.04em; white-space:nowrap; margin-right:4px;
}
.gwandok-chip {
  display:inline-flex; align-items:center; gap:5px;
  background:#DBEAFE; color:#1E3A8A; border:1.5px solid #60A5FA;
  border-radius:20px; padding:5px 14px; font-size:14px; font-weight:800;
}
.gwandok-chip .g-num { font-size:12px; color:#2563EB; font-weight:700; }
.gwandok-empty { color:#93C5FD; font-style:italic; font-size:13px; }

/* 시간표 테이블 */
.tt-wrap { overflow-x:auto; }
table.tt {
  border-collapse:collapse; width:100%; min-width:600px;
  table-layout:fixed;
  background:var(--card); border-radius:10px; overflow:hidden;
  box-shadow:0 1px 3px rgba(0,0,0,.06);
}
table.tt th, table.tt td {
  border:1px solid #CBD5E1; padding:6px 8px; vertical-align:top;
  width:calc((100% - 56px) / 5);
}
table.tt thead th {
  background:#1E1B4B; color:#C7D2FE; font-size:12px; font-weight:800;
  text-align:center; padding:8px;
}
table.tt thead th.period-head {
  background:#312E81; color:#A5B4FC; width:56px; font-size:11px;
}
table.tt tbody td.period-cell {
  background:#F1F5F9; text-align:center;
  font-size:13px; font-weight:800; color:#334155; width:56px;
  border-right:2px solid #94A3B8;
}
table.tt tbody tr:hover td { background:#FAFAFE; }
table.tt tbody tr:hover td.period-cell { background:#E9EEF5; }

/* 셀 내부 학생 카드 */
.cell-inner { min-height:36px; }
.no-absent { color:#94A3B8; font-size:11px; text-align:center; padding:8px 0; }
.student-chip {
  display:flex; align-items:center; gap:4px;
  padding:3px 6px; margin:2px 0; border-radius:6px;
  background:#FEF3C7; border-left:3px solid #D97706;
}
.chip-num { font-size:11px; font-weight:800; color:#7C2D12; min-width:20px; text-align:right; white-space:nowrap; }
.chip-name { font-size:12px; font-weight:900; color:#7C2D12; white-space:nowrap; }
.chip-sub {
  font-size:10px; font-weight:800; padding:1px 5px;
  border-radius:8px; white-space:nowrap;
}

/* 과목 색 */
.sub-국어    { background:#C4B5FD; color:#3B0764; }
.sub-영어    { background:#6EE7B7; color:#064E3B; }
.sub-수학    { background:#FCA5A5; color:#7F1D1D; }
.sub-확통    { background:#FCD34D; color:#713F12; }
.sub-사문    { background:#F9A8D4; color:#500724; }
.sub-생윤    { background:#7DD3FC; color:#0C2A4A; }
.sub-세지    { background:#86EFAC; color:#14532D; }

/* ── 단일 반 인쇄 ── */
@media print {
  /* margin:0 — 브라우저 인쇄 여백 설정과 무관하게 padding으로 여백 처리 */
  @page { size: A4 landscape; margin: 0; }
  .topbar, .class-tabs, .student-list-section, .site-nav { display:none !important; }
  body { background:#fff; }
  .main { padding:12mm 15mm !important; max-width:none !important; margin:0 !important; width:100% !important; box-sizing:border-box !important; }
  .print-header { display:block !important; font-size:13px; font-weight:800; margin-bottom:6px; color:#1E293B; }
  .class-header-bar { margin-bottom:6px; }
  .class-title { font-size:16px; }
  .class-subtitle { font-size:11px; }
  .total-badge { font-size:11px; padding:3px 10px; }
  .gwandok-bar { padding:7px 12px; margin-bottom:8px; border:2px solid #93C5FD; border-left:4px solid #2563EB; -webkit-print-color-adjust:exact; print-color-adjust:exact; }
  .gwandok-label { font-size:13px; }
  .gwandok-chip { font-size:13px; padding:4px 12px; -webkit-print-color-adjust:exact; print-color-adjust:exact; }
  .gwandok-chip .g-num { font-size:11px; }
  .tt-wrap { overflow:visible; }
  table.tt { box-shadow:none; border:2px solid #333 !important; min-width:unset; border-radius:0; width:100% !important; table-layout:fixed; page-break-inside:avoid; }
  table.tt tbody tr { height:19mm; }
  table.tt th, table.tt td { padding:5px 7px; border:1px solid #777 !important; vertical-align:top; }
  table.tt thead th { background:#1E1B4B !important; color:#fff !important; font-size:13px; font-weight:800; padding:6px 5px; -webkit-print-color-adjust:exact; print-color-adjust:exact; }
  table.tt thead th.period-head { background:#312E81 !important; font-size:12px; -webkit-print-color-adjust:exact; print-color-adjust:exact; }
  table.tt tbody td.period-cell { font-size:13px; font-weight:900; text-align:center; background:#D1D5DB !important; color:#111 !important; border-right:2px solid #444 !important; -webkit-print-color-adjust:exact; print-color-adjust:exact; }
  table.tt tbody tr:hover td { background:inherit; }
  table.tt tbody tr:nth-child(even) td:not(.period-cell) { background:#F9FAFB !important; -webkit-print-color-adjust:exact; print-color-adjust:exact; }
  .cell-inner { min-height:unset; }
  .student-chip { padding:3px 6px; margin:2px 0; border-radius:4px; border-left-width:3px; -webkit-print-color-adjust:exact; print-color-adjust:exact; }
  .chip-num { font-size:12px; }
  .chip-name { font-size:13px; }
  .chip-sub { font-size:11px; padding:1px 5px; -webkit-print-color-adjust:exact; print-color-adjust:exact; }
  .no-absent { padding:4px 0; font-size:11px; }
}
.print-header { display:none; font-size:13px; font-weight:800; padding:6px 0 10px; color:#1E293B; }
</style>
</head>
<body>

<nav class="site-nav">
  <a href="index.html" class="snav-tab">👨‍🏫 교사 시간표</a>
  <a href="반별시간표.html" class="snav-tab">📅 반별 시간표</a>
  <a href="파이널출석안내.html" class="snav-tab cur">✅ Final 출석 안내</a>
</nav>

<div class="topbar">
  <h1>📋 Final 특강 출석 안내</h1>
  <span class="sub" id="dateRange"></span>
  <a href="반별시간표.html" target="_blank" class="btn-link">📅 반별 시간표</a>
  <a href="index.html" target="_blank" class="btn-link">👨‍🏫 교사 시간표</a>
  <div class="divider"></div>
  <div class="print-controls">
    <span class="print-label">이 반 인쇄</span>
    <button class="scale-btn active" onclick="setScale(this,1)">100%</button>
    <button class="scale-btn" onclick="setScale(this,0.85)">85%</button>
    <button class="scale-btn" onclick="setScale(this,0.75)">75%</button>
    <button class="scale-btn" onclick="setScale(this,0.65)">65%</button>
    <button class="btn-link btn-print" onclick="doPrint()">🖨️ 이 반 인쇄</button>
  </div>
  <div class="divider"></div>
  <button class="btn-link btn-printall" onclick="printAll()">🖨️ 전체 인쇄 (1~11반)</button>
</div>

<div class="class-tabs" id="classTabs"></div>

<div class="main">
  <div class="print-header" id="printHeader"></div>
  <div id="content" class="loading">데이터 불러오는 중...</div>
</div>

<script>
const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbyrXoKySwqCCMLfTNsExXw_6ugNOmS3Xj9HI1iLUy5LMbOQs5QqudzHTlZ79E2_WKkkwg/exec';
const DATE_RANGE = '10월 21일(수) ~ 11월 13일(금)';
const NUM_CLASSES = 11;
const DAYS    = ['월','화','수','목','금'];
const PERIODS = [7, 6, 6, 7, 6]; // 월화수목금 최대 교시

const FINAL_SCHEDULE = {
  '국어':        ['화1','화2','목3'],
  '영어':        ['화3','화4','목5','목6'],
  '수학':        ['금3','금4'],
  '확률과 통계': ['수1','수2'],
  '사회문화':    ['월5','월6'],
  '생활과 윤리': ['금1','금2'],
  '세계지리':    ['월3','월4','목1','목2'],
};

const SHORT = {
  '국어':'국어','영어':'영어','수학':'수학',
  '확률과 통계':'확통','사회문화':'사문','생활과 윤리':'생윤','세계지리':'세지'
};
const SHORT_CLS = {
  '국어':'sub-국어','영어':'sub-영어','수학':'sub-수학',
  '확률과 통계':'sub-확통','사회문화':'sub-사문','생활과 윤리':'sub-생윤','세계지리':'sub-세지'
};

let DB = null;
let GWANDOK_DB = null;
let currentBan = 1;
let currentScale = 1;

function esc(s) { return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

function getClassFromHakbun(hakbun) {
  return parseInt(String(hakbun).slice(1, 3));
}
function getNumFromHakbun(hakbun) {
  const s = String(hakbun);
  return s.length >= 5 ? parseInt(s.slice(3)) : parseInt(hakbun) % 100;
}

// ─── 반별 자동 배율 계산 ───
// 한 슬롯에 최대 몇 명이 있는지 보고 결정
function calcAutoZoom(ban) {
  if (!DB) return 1;
  const students = (DB.enrollment || []).filter(s => s.ban === ban);
  const slotCounts = {};
  students.forEach(s => {
    (s.subjects || []).forEach(sub => {
      (FINAL_SCHEDULE[sub] || []).forEach(slot => {
        slotCounts[slot] = (slotCounts[slot] || 0) + 1;
      });
    });
  });
  const vals = Object.values(slotCounts);
  const maxInSlot = vals.length > 0 ? Math.max(...vals) : 0;
  if (maxInSlot <= 3) return 1;
  if (maxInSlot <= 5) return 0.85;
  if (maxInSlot <= 7) return 0.75;
  return 0.65;
}

// ─── 단일 반 HTML 조립 ───
function buildClassHtml(ban) {
  const students = (DB.enrollment || []).filter(s => s.ban === ban);
  const gwandokStudents = GWANDOK_DB && GWANDOK_DB.students
    ? GWANDOK_DB.students.filter(s => getClassFromHakbun(s.hakbun) === ban)
    : null;

  const slotMap = {};
  students.forEach(s => {
    (s.subjects || []).forEach(sub => {
      const slots = FINAL_SCHEDULE[sub] || [];
      slots.forEach(slot => {
        if (!slotMap[slot]) slotMap[slot] = [];
        slotMap[slot].push({ name: s.name, sub, hakbun: s.hakbun });
      });
    });
  });

  const totalStudents = students.length;
  const maxPeriod = Math.max(...PERIODS);

  let gwandokHtml = '';
  if (gwandokStudents !== null) {
    const chips = gwandokStudents.length > 0
      ? gwandokStudents
          .sort((a, b) => getNumFromHakbun(a.hakbun) - getNumFromHakbun(b.hakbun))
          .map(g => {
            const num = getNumFromHakbun(g.hakbun);
            return `<span class="gwandok-chip"><span class="g-num">${num}번</span> ${esc(g.name)}</span>`;
          }).join('')
      : `<span class="gwandok-empty">이 반 학생 없음</span>`;
    gwandokHtml = `<div class="gwandok-bar"><span class="gwandok-label">🏫 영생관독실</span>${chips}</div>`;
  }

  let html = `
  <div class="class-header-bar">
    <span class="class-title">${ban}반</span>
    <span class="class-subtitle">특강 수강 학생 ${totalStudents}명</span>
    <span class="total-badge${totalStudents === 0 ? ' zero' : ''}">
      ${totalStudents > 0 ? `총 ${totalStudents}명 수강 중` : '수강 학생 없음'}
    </span>
  </div>
  ${gwandokHtml}
  <div class="tt-wrap">
  <table class="tt">
    <thead>
      <tr>
        <th class="period-head">교시</th>
        ${DAYS.map(d => `<th>${d}요일</th>`).join('')}
      </tr>
    </thead>
    <tbody>`;

  for (let p = 1; p <= maxPeriod; p++) {
    html += `<tr><td class="period-cell">${p}교시</td>`;
    DAYS.forEach((day, di) => {
      if (p > PERIODS[di]) {
        html += `<td style="background:#F1F5F9;"></td>`;
        return;
      }
      const slot = day + p;
      const absentList = (slotMap[slot] || []).slice()
        .sort((a, b) => getNumFromHakbun(a.hakbun) - getNumFromHakbun(b.hakbun));
      html += `<td><div class="cell-inner">`;
      if (absentList.length === 0) {
        html += `<div class="no-absent">—</div>`;
      } else {
        absentList.forEach(item => {
          const cls = SHORT_CLS[item.sub] || '';
          const num = getNumFromHakbun(item.hakbun);
          html += `<div class="student-chip">
            <span class="chip-num">${num}번</span>
            <span class="chip-name">${esc(item.name)}</span>
            <span class="chip-sub ${cls}">${esc(SHORT[item.sub] || item.sub)}</span>
          </div>`;
        });
      }
      html += `</div></td>`;
    });
    html += `</tr>`;
  }

  html += `</tbody></table></div>`;
  return html;
}

// ─── 이 반만 인쇄 ───
function setScale(btn, scale) {
  currentScale = scale;
  document.querySelectorAll('.scale-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
}

function doPrint() {
  const dynStyle = document.getElementById('dynPrintStyle');
  if (currentScale === 1) {
    dynStyle.textContent = '';
  } else {
    dynStyle.textContent = `@media print { .main { zoom:${currentScale}; transform-origin:top left; } }`;
  }
  document.getElementById('printHeader').textContent =
    `Final 특강 출석 안내 — ${currentBan}반 (${DATE_RANGE})`;
  window.print();
}

// ─── 전체 반 인쇄 (반별 자동 배율) ───
function getFullPrintCSS() {
  return `
    *{box-sizing:border-box;margin:0;padding:0;}
    body{font-family:'Apple SD Gothic Neo',Malgun Gothic,sans-serif;background:#fff;}
    @page{size:A4 landscape;margin:0;}
    .class-page{width:100%;transform-origin:top left;padding:12mm 15mm;box-sizing:border-box;}
    .page-break{page-break-after:always;}
    .print-header{font-size:13px;font-weight:800;margin-bottom:6px;color:#1E293B;}
    .class-header-bar{display:flex;align-items:center;gap:10px;margin-bottom:6px;flex-wrap:wrap;}
    .class-title{font-size:16px;font-weight:900;color:#1E293B;}
    .class-subtitle{font-size:11px;color:#64748B;}
    .total-badge{margin-left:auto;padding:3px 10px;border-radius:20px;font-size:11px;font-weight:700;background:#FEF3C7;color:#92400E;border:1px solid #FCD34D;-webkit-print-color-adjust:exact;print-color-adjust:exact;}
    .total-badge.zero{background:#F1F5F9;color:#94A3B8;border-color:#E2E8F0;}
    .gwandok-bar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:7px 12px;margin-bottom:8px;background:#EFF6FF;border:2px solid #93C5FD;border-left:4px solid #2563EB;border-radius:6px;-webkit-print-color-adjust:exact;print-color-adjust:exact;}
    .gwandok-label{font-size:13px;font-weight:900;color:#1D4ED8;white-space:nowrap;margin-right:4px;}
    .gwandok-chip{display:inline-flex;align-items:center;gap:5px;background:#DBEAFE;color:#1E3A8A;border:1.5px solid #60A5FA;border-radius:20px;padding:4px 12px;font-size:13px;font-weight:800;-webkit-print-color-adjust:exact;print-color-adjust:exact;}
    .gwandok-chip .g-num{font-size:11px;color:#2563EB;font-weight:700;}
    .gwandok-empty{color:#93C5FD;font-style:italic;font-size:13px;}
    .tt-wrap{overflow:visible;}
    table.tt{border-collapse:collapse;width:100%;table-layout:fixed;border:2px solid #333 !important;border-radius:0;}
    table.tt tbody tr{height:19mm;}
    table.tt th,table.tt td{border:1px solid #777 !important;padding:5px 7px;vertical-align:top;width:calc((100% - 56px)/5);}

}

function printAll() {
  if (!DB) { alert('데이터가 아직 로드되지 않았습니다. 잠시 후 다시 시도해주세요.'); return; }

  const win = window.open('', '_blank', 'width=1200,height=800');

  let pagesHtml = '';
  for (let ban = 1; ban <= NUM_CLASSES; ban++) {
    const zoom = calcAutoZoom(ban);
    const zoomPct = Math.round(zoom * 100);
    const isLast = (ban === NUM_CLASSES);
    pagesHtml += `<div class="class-page${isLast ? '' : ' page-break'}" style="zoom:${zoom}">`;
    pagesHtml += `<div class="print-header">Final 특강 출석 안내 — ${ban}반 (${DATE_RANGE}) <span style="font-size:11px;color:#94A3B8;font-weight:400">[자동 ${zoomPct}%]</span></div>`;
    pagesHtml += buildClassHtml(ban);
    pagesHtml += `</div>`;
  }

  win.document.write(`<!DOCTYPE html>
<html lang="ko"><head>
<meta charset="UTF-8">
<title>Final 특강 출석 안내 — 전체 (1~${NUM_CLASSES}반)</title>
<style>${getFullPrintCSS()}</style>
</head><body>${pagesHtml}</body></html>`);
  win.document.close();

  // 렌더링 후 인쇄 대화상자 열기
  setTimeout(() => { win.focus(); win.print(); }, 700);
}

// ─── 데이터 로드 ───
document.getElementById('dateRange').textContent = DATE_RANGE;

function startTimer(updateFn) {
  const t0 = Date.now();
  const iv = setInterval(() => updateFn(Math.floor((Date.now()-t0)/1000)), 1000);
  return () => clearInterval(iv);
}

async function fetchWithRetry(url, maxTry = 2, timeout = 90000) {
  let lastErr;
  for (let i = 1; i <= maxTry; i++) {
    const ctrl = new AbortController();
    const tid  = setTimeout(() => ctrl.abort(), timeout);
    try {
      const res  = await fetch(url, { signal: ctrl.signal });
      clearTimeout(tid);
      const text = await res.text();
      if (text.trimStart()[0] !== '{' && text.trimStart()[0] !== '[') {
        throw new Error('Apps Script가 HTML을 반환했습니다. 잠시 후 재시도해주세요.');
      }
      return JSON.parse(text);
    } catch(e) {
      clearTimeout(tid);
      lastErr = (e.name === 'AbortError')
        ? new Error('Apps Script 응답 시간 초과 (콜드 스타트). 재시도 버튼을 눌러주세요.')
        : e;
      if (i < maxTry) await new Promise(r => setTimeout(r, 2000));
    }
  }
  throw lastErr;
}

async function initLoad() {
  const contentEl = document.getElementById('content');
  contentEl.innerHTML = '<div class="loading">⏳ 데이터 불러오는 중… 0초</div>';
  const stopTimer = startTimer(sec => {
    contentEl.innerHTML = `<div class="loading">⏳ Apps Script 응답 대기 중… ${sec}초</div>`;
  });
  try {
    const [enrollData, gwandokData] = await Promise.all([
      fetchWithRetry(SCRIPT_URL + '?type=enrollment'),
      fetchWithRetry(SCRIPT_URL + '?type=gwandok').catch(() => null)
    ]);
    stopTimer();
    DB = enrollData;
    GWANDOK_DB = gwandokData;
    buildTabs();
    renderClass(currentBan);
  } catch(err) {
    stopTimer();
    contentEl.innerHTML =
      `<div class="error-msg">
        데이터를 불러오지 못했습니다.<br>
        <small style="color:#94A3B8;margin-top:6px;display:block">
          ${err.message || '네트워크 오류 — 잠시 후 다시 시도해주세요'}
        </small><br>
        <button onclick="initLoad()"
          style="margin-top:8px;padding:6px 16px;border-radius:8px;border:none;
          background:#4F46E5;color:#fff;font-size:13px;font-weight:700;cursor:pointer;">
          🔄 다시 시도
        </button>
      </div>`;
  }
}

initLoad();

function buildTabs() {
  const wrap = document.getElementById('classTabs');
  wrap.innerHTML = '';
  for (let c = 1; c <= NUM_CLASSES; c++) {
    const cnt = DB.enrollment ? DB.enrollment.filter(s => s.ban === c).length : 0;
    const tab = document.createElement('button');
    tab.className = 'cls-tab' + (cnt > 0 ? ' has-absent' : '') + (c === 1 ? ' active' : '');
    tab.textContent = c + '반';
    tab.dataset.ban = c;
    tab.addEventListener('click', () => {
      document.querySelectorAll('.cls-tab').forEach(t => t.classList.remove('active'));
      tab.classList.add('active');
      currentBan = c;
      renderClass(c);
    });
    wrap.appendChild(tab);
  }
}

function renderClass(ban) {
  if (!DB) return;
  document.getElementById('printHeader').textContent =
    `Final 특강 출석 안내 — ${ban}반 (${DATE_RANGE})`;

  let html = buildClassHtml(ban);

  // 하단 학생 목록 (화면 전용, 인쇄 숨김)
  const students = (DB.enrollment || []).filter(s => s.ban === ban);
  if (students.length > 0) {
    html += `<div class="student-list-section" style="margin-top:16px;background:#fff;border:1px solid var(--border);
      border-radius:10px;padding:12px 16px;">
      <div style="font-size:12px;font-weight:800;color:var(--muted);margin-bottom:8px">
        ${ban}반 수강 학생 전체 목록
      </div>`;
    students.slice()
      .sort((a, b) => getNumFromHakbun(a.hakbun) - getNumFromHakbun(b.hakbun))
      .forEach(s => {
        const num = getNumFromHakbun(s.hakbun);
        html += `<div style="display:flex;align-items:center;gap:8px;padding:4px 0;
          border-bottom:1px solid #F1F5F9;font-size:13px;">
          <span style="font-weight:700;min-width:30px;color:#94A3B8;font-size:11px">${num}번</span>
          <span style="font-weight:700;min-width:56px">${esc(s.name)}</span>
          <span style="color:var(--muted);font-size:11px">`;
        (s.subjects || []).forEach(sub => {
          const cls = SHORT_CLS[sub] || '';
          html += `<span class="chip-sub ${cls}" style="margin-right:4px">${esc(SHORT[sub] || sub)}</span>`;
        });
        html += `</span></div>`;
      });
    html += `</div>`;
  }

  document.getElementById('content').innerHTML = html;
}
